name: pii_detection_2026
services:
  # The Database (Postgres + pgvector for semantic search)
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASS:-password}
      POSTGRES_DB: ${DB_NAME:-pii_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-pii_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The Application (FastAPI + React/Jinja)
  api:
    build:
      context: .
      dockerfile: deploy/api-Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-user}:${DB_PASS:-password}@db:5432/${DB_NAME:-pii_db}
      - OLLAMA_HOST=host.docker.internal:11434  # Connects to Ollama running on your Windows host
      - MODEL_NAME=gemma3:1b # Corrected to Gemma 3 1B
    extra_hosts:
      - "host.docker.internal:host-gateway" # Allows container to talk to localhost (Ollama)
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
